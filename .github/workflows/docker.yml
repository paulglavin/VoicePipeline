name: Build and push Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - variant: faster-whisper
            enable_local_stt: "false"
            enable_faster_whisper: "true"
            # :latest and :faster-whisper are the same image — faster-whisper is the default
            floating_tags: |
              ghcr.io/paulglavin/voicepipeline:latest
              ghcr.io/paulglavin/voicepipeline:faster-whisper
            version_suffix: ""
          - variant: cuda
            enable_local_stt: "true"
            enable_faster_whisper: "true"
            floating_tags: |
              ghcr.io/paulglavin/voicepipeline:cuda
            version_suffix: "-cuda"

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate image tags
        id: meta
        run: |
          TAGS="${{ matrix.floating_tags }}"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAGS="$TAGS
          ghcr.io/paulglavin/voicepipeline:${{ github.ref_name }}${{ matrix.version_suffix }}"
          fi
          {
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push (${{ matrix.variant }})
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            ENABLE_LOCAL_STT=${{ matrix.enable_local_stt }}
            ENABLE_FASTER_WHISPER=${{ matrix.enable_faster_whisper }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
