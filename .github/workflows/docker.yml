name: Build and push Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - variant: slim
            enable_local_stt: "false"
            tags: |
              ghcr.io/paulglavin/voicepipeline:latest
              ghcr.io/paulglavin/voicepipeline:slim
          - variant: cuda
            enable_local_stt: "true"
            tags: |
              ghcr.io/paulglavin/voicepipeline:cuda

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push (${{ matrix.variant }})
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ matrix.tags }}
          build-args: |
            ENABLE_LOCAL_STT=${{ matrix.enable_local_stt }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
