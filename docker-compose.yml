services:
  voicepipeline:
    build: .
    container_name: voicepipeline
    ports:
      - "8000:8000"       # HTTP — management UI + API
      - "10300:10300"     # Wyoming STT — add this as a custom integration in HA
    volumes:
      - ./data:/data                  # runtime data (DB, audio clips, embeddings)
      - ./models:/models              # ML model weights (host bind mount — survives rebuilds and volume ops)
    environment:
      DB_PATH:           /data/speaker.db
      AUDIO_DIR:         /data/audio
      EMBEDDING_DIR:     /data/embeddings
      MODEL_DIR:         /models
      WYOMING_HOST:      0.0.0.0
      WYOMING_PORT:      "10300"
      # Required — granite-4.0-1b-speech is a gated model.
      # Set HF_TOKEN in a .env file alongside docker-compose.yml.
      HF_TOKEN: ${HF_TOKEN}
      DTLN_MIX: "0.3"         # 0 = bypass NS entirely for audio quality testing
      # HA Personality Engine integration.
      # Set HA_BASE_URL to your HA instance and flip HA_WEBHOOK_ENABLED to "true"
      # once the personality_engine custom component is installed in HA.
      HA_BASE_URL: "http://192.168.2.30:8123"           # e.g. http://homeassistant.local:8123
      HA_WEBHOOK_ENABLED: "true"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/settings')"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s    # first run downloads ~3–4 GB of model weights

volumes: {}  # model weights now in ./models bind mount; named volume no longer needed
