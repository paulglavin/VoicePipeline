# Example: intent scripts that work with Personality Engine
#
# When Personality Engine routes a command to the built-in HA agent and the
# intent matches, HA executes the intent script. These scripts can use the
# conversation response to speak via TTS — but since Personality Engine
# already handles TTS routing for LLM responses, intent scripts should use
# the same media_player that the satellite is paired with.
#
# Simplest approach: let Personality Engine handle ALL TTS (including intent
# responses). HA's built-in agent returns an ACTION_DONE response which
# Personality Engine detects and returns directly without further TTS.
# The device action happens silently (no spoken confirmation).
#
# For spoken confirmations from intent scripts, use the satellite's media_player.
# The satellite entity name follows the pattern:
#   assist_satellite.<device_name>_assist_satellite
# The paired media_player follows (resolved by area or naming convention):
#   media_player.<device_name>
#
# ─────────────────────────────────────────────────────────────────────────────
# Add these to your configuration.yaml under intent_script:
# ─────────────────────────────────────────────────────────────────────────────

intent_script:

  # ── Lights off with spoken confirmation ──────────────────────────────────
  # Triggered when user says "turn off the lights" (matched by HA intent).
  # Speaks a brief confirmation via the area's media_player.
  #
  # NOTE: Only add spoken confirmation here if you want every lights-off
  # command acknowledged. For silent execution, remove the tts.speak action.

  TurnOffLight:
    speech:
      text: "Lights off."
    # The above speech is returned to HA Assist as the intent response text.
    # Personality Engine reads this and routes it to the correct media_player
    # when it detects ACTION_DONE from the built-in agent.

  # ── Good morning scene ────────────────────────────────────────────────────
  # Custom intent for "good morning" — runs a scene and greets by name.
  # The {name} slot is populated by HA's intent matcher if you configure
  # a custom intent with a name slot, or hardcode for each household member.

  GoodMorning:
    action:
      - service: scene.turn_on
        target:
          entity_id: scene.morning_routine
      - service: tts.speak
        data:
          # Target the living room media player for morning routine
          entity_id: media_player.living_room
          message: >-
            Good morning! Morning scene activated.
          cache: false
          options:
            voice: en_US-ryan-medium

  # ── Bedtime routine ───────────────────────────────────────────────────────
  # "Goodnight" → run bedtime scene, no spoken response needed

  GoodNight:
    action:
      - service: scene.turn_on
        target:
          entity_id: scene.bedtime
    speech:
      text: "Goodnight. Sleep well."

# ─────────────────────────────────────────────────────────────────────────────
# Custom intent definitions (intents.yaml or under homeassistant: in config)
# ─────────────────────────────────────────────────────────────────────────────
